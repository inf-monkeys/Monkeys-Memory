deployment:
  mode: local

server:
  port: 0
  host: 127.0.0.1

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: monkeys_memory_test
  logging: false

redis:
  host: localhost
  port: 6379
  password:

embeddings:
  enabled: true
  provider: auto
  model: text-embedding-3-small
  dimensions: 1536
  apiKey:
  baseUrl: https://api.openai.com/v1
  timeoutMs: 10000
  fallbackToLocal: true

vectorStore:
  enabled: true
  provider: qdrant
  url: http://localhost:6333
  apiKey:
  collectionPrefix: monkeys_memory_items
  timeoutMs: 10000
  searchLimit: 80

console:
  baseUrl: http://localhost:8080

cors:
  allowedOrigins:
    - http://localhost:8080

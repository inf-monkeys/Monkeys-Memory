name: Bug report
description: Report something broken in Monkeys Memory.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Monkeys Memory.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, config, or UI steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main, v1.0.0, or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove tokens, secrets, and private memory data.
      render: shell
